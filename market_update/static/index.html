<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Webex Market Update</title>
<meta name="description" content="Webex Market Update: a live market desk for day and swing traders. Verdicts per stock, automatic volume scanner, low-float movers, smart money, options flow and the macro picture, refreshed every hour.">
<meta name="application-name" content="Webex Market Update">
<meta name="theme-color" content="#050505">
<link rel="icon" type="image/svg+xml" href="static/logo.svg">
<link rel="icon" type="image/png" sizes="512x512" href="static/favicon.png">
<link rel="apple-touch-icon" sizes="180x180" href="static/apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Webex Market Update">
<meta property="og:title" content="Webex Market Update">
<meta property="og:description" content="Live market desk for day and swing traders: verdicts per stock, automatic volume scanner, low-float movers, smart money, options flow and macro, refreshed hourly.">
<meta property="og:url" content="__PUBLIC_URL__/">
<meta property="og:image" content="__PUBLIC_URL__/static/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Webex Market Update">
<meta name="twitter:description" content="Live market desk for day and swing traders: verdicts, volume scanner, low float, smart money, options flow, macro.">
<meta name="twitter:image" content="__PUBLIC_URL__/static/og.png">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/styles.css">
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.2.3/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>
<div class="shell" id="shell">
  <aside class="side" id="side">
    <div class="side-brand"><img class="logo" src="static/logo.svg" alt="Webex Market Update" width="30" height="30"><span class="brand-text"><small>WEBEX</small> <b>MARKET UPDATE</b></span><button class="side-toggle" id="side-toggle" title="Collapse the menu" aria-label="Collapse the menu">‹</button></div>
    <nav class="side-nav" id="nav" aria-label="Views"></nav>
    <div class="side-foot" id="side-foot"></div>
  </aside>
  <div class="hud">
    <header class="hud-bar">
      <div class="hud-search"><span class="add-label">＋ ADD TICKER</span><input id="search" type="search" placeholder="type a ticker or company · press /" autocomplete="off" spellcheck="false" aria-label="Search any stock or ETF"><div id="search-results" class="search-results" hidden></div></div>
      <div class="hud-spacer"></div>
      <div class="hud-status">
      <span class="readout" id="market-state">—</span>
      <span class="readout" id="session-line">LOADING</span>
      <span class="readout" id="generated-line"></span>
      <button class="btn" id="refresh-btn" title="Rebuild the report now">REFRESH</button>
      <button class="btn ghost logout" id="logout-btn" title="Sign out of this browser" hidden>SIGN OUT</button>
      <button class="btn ghost" id="theme-btn" hidden>THEME</button>
    </div>
    </header>
    <div id="notice" class="notice" hidden></div>
    <main id="app"><div class="loading">>>> LOADING REPORT</div></main>
    <footer id="footer"></footer>
  </div>
</div>
<div id="gate" class="gate" hidden></div>
<script src="/static/app.js"></script>
</body>
</html>
