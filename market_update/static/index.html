<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OneView</title>
<meta name="description" content="OneView: a clearer market desk for day trades, swing setups and long-term decisions. Assessments per stock with plain reasons, a volume scanner, filings and flow, and market context.">
<meta name="application-name" content="OneView">
<meta name="mu-app-url" content="__APP_URL__">
<meta name="mu-api-url" content="__API_URL__">
<meta name="theme-color" content="#080E1D">
<link rel="icon" type="image/png" sizes="64x64" href="static/brand/favicon.png?v=4">
<link rel="shortcut icon" href="static/brand/favicon.png?v=4">
<link rel="apple-touch-icon" sizes="180x180" href="static/brand/apple-touch-icon.png?v=4">
<meta property="og:type" content="website">
<meta property="og:site_name" content="OneView">
<meta property="og:title" content="OneView">
<meta property="og:description" content="A clearer market desk for day trades, swing setups and long-term decisions.">
<meta property="og:url" content="__PUBLIC_URL__/">
<meta property="og:image" content="__PUBLIC_URL__/static/brand/og.png?v=3">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="OneView">
<meta name="twitter:description" content="A clearer market desk for day trades, swing setups and long-term decisions.">
<meta name="twitter:image" content="__PUBLIC_URL__/static/brand/og.png?v=3">
<link rel="stylesheet" href="/static/styles.css">
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.2.3/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>
<a class="skip" href="#app">Skip to content</a>
<div class="shell" id="shell">
  <header class="topbar side" id="side">
    <a class="brand-link side-brand" href="#view=home" aria-label="OneView overview"><img class="brand-logo" src="static/brand/oneview-logo.png" alt="OneView" width="185" height="57"></a>
    <nav class="topnav side-nav" id="nav" aria-label="Sections"></nav>
    <div class="top-actions hud-status" aria-label="Account and refresh">
      <span class="readout badge" id="market-state">—</span>
      <button class="btn ghost icon-btn" id="refresh-btn" title="Rebuild the report now" aria-label="Refresh the report"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg><span class="lbl">Refresh</span></button>
      <button class="btn ghost icon-btn logout" id="logout-btn" title="Sign out of this browser" hidden><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg><span class="lbl">Sign out</span></button>
      <button class="btn ghost" id="theme-btn" hidden>Theme</button>
    </div>
    <div class="top-right side-foot" id="side-foot" hidden></div>
    <button class="side-toggle" id="side-toggle" hidden aria-hidden="true"></button>
  </header>
  <div class="hud">
    <div class="hud-bar">
      <div class="hud-context" id="hud-context"><b id="hud-title">Your market overview</b><span id="hud-sub"></span></div>
      <div class="horizon" id="horizon" role="group" aria-label="Analysis timeframe"></div>
      <div class="hud-spacer"></div>
      <div class="hud-stamps">
        <span class="readout" id="session-line">Loading</span>
        <span class="readout" id="generated-line"></span>
        <span class="readout count" id="refresh-count" title="The page pulls fresh data at the top of every hour">—</span>
      </div>
    </div>
    <div id="tape" class="tape-bar" hidden aria-label="Market tape"></div>
    <div id="notice" class="notice" hidden role="status" aria-live="polite"></div>
    <main id="app" tabindex="-1"><div class="loading">Loading the latest report…</div></main>
    <footer id="footer"></footer>
  </div>
</div>
<div id="gate" class="gate" hidden></div>
<script src="/static/app.js"></script>
</body>
</html>
