<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Market Update</title>
<meta name="description" content="Tactical market terminal for day and swing traders: mood, watchlist plans, theme screen, smart money, macro and technicals.">
<link rel="stylesheet" href="/static/styles.css">
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.2.3/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>
<div class="shell" id="shell">
  <aside class="side" id="side">
    <div class="side-brand"><svg class="logo" viewBox="0 0 40 40" aria-hidden="true"><defs><linearGradient id="hexg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5B9CFF"/><stop offset="1" stop-color="#3DDC84"/></linearGradient></defs><path d="M20 2.5 35.2 11.2v17.6L20 37.5 4.8 28.8V11.2Z" fill="url(#hexg)"/><path d="M20 6.5 31.7 13.2v13.6L20 33.5 8.3 26.8V13.2Z" fill="#0F1115" opacity=".92"/><path d="M11 25.5 15.5 17l4.5 5.5 4.5-8 4.5 11" fill="none" stroke="url(#hexg)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="brand-text">MARKET <b>UPDATE</b></span><button class="side-toggle" id="side-toggle" title="Collapse the menu" aria-label="Collapse the menu">‹</button></div>
    <nav class="side-nav" id="nav" aria-label="Views"></nav>
    <div class="side-foot" id="side-foot"></div>
  </aside>
  <div class="hud">
    <header class="hud-bar">
      <div class="hud-search"><span class="add-label">＋ ADD TICKER</span><input id="search" type="search" placeholder="type a ticker or company · press /" autocomplete="off" spellcheck="false" aria-label="Search any stock or ETF"><div id="search-results" class="search-results" hidden></div></div>
      <div class="hud-spacer"></div>
      <div class="hud-status">
      <span class="readout" id="market-state">—</span>
      <span class="readout" id="session-line">LOADING</span>
      <span class="readout" id="generated-line"></span>
      <button class="btn" id="refresh-btn" title="Rebuild the report now">REFRESH</button>
      <button class="btn ghost" id="theme-btn" hidden>THEME</button>
    </div>
    </header>
    <div id="notice" class="notice" hidden></div>
    <main id="app"><div class="loading">>>> LOADING REPORT</div></main>
    <footer id="footer"></footer>
  </div>
</div>
<div id="gate" class="gate" hidden></div>
<script src="/static/app.js"></script>
</body>
</html>
