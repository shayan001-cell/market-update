[project]
name = "market-update"
version = "1.0.0"
description = "Daily pre-market preview dashboard for day traders, powered by TypeSafe judgments"
requires-python = ">=3.11"
dependencies = [
    "typesafe-sdk",
    "yfinance>=0.2.50",
    "requests",
    "pandas",
    "numpy",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.scripts]
market-update = "market_update.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["market_update"]
